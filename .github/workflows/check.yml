name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The Lazurio CLI that judges the Module's readiness, pinned to a release.
  LAZURIO_VERSION: v0.1.27

# One Linux job runs every gate on every pull request and every push to main
# (Module Standard, CI). Windows runs separately, see windows-portability.yml.
jobs:
  check:
    name: bun run check (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/v3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: test "$(bun --version)" = "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - name: Install the pinned Lazurio CLI
        working-directory: .
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/Lazurio/LazurioPlatform/releases/download/${LAZURIO_VERSION}/install.sh" \
            -o "$RUNNER_TEMP/lazurio-install.sh"
          sh "$RUNNER_TEMP/lazurio-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # `lazurio module readiness` exits 0 for ready-for-trial too, so the
      # step reads the verdict and fails on anything but ready-for-live.
      - name: Module readiness is ready-for-live
        working-directory: .
        run: |
          report="$RUNNER_TEMP/readiness.json"
          status=0
          lazurio module readiness "$GITHUB_WORKSPACE" --json > "$report" || status=$?
          verdict="$(jq -r '.verdict // "unknown"' "$report" 2>/dev/null || echo unknown)"
          echo "lazurio module readiness: $verdict (exit $status)"
          jq -r '.findings[]? | "- [\(.level)] \(.id): \(.message)"' "$report" 2>/dev/null || cat "$report"
          jq -r '.hostConditions[]? | "- host condition \(.id): \(.detail)"' "$report" 2>/dev/null || true
          if [ "$verdict" != "ready-for-live" ]; then
            echo "::error::The Module is $verdict, not ready-for-live."
            exit 1
          fi
